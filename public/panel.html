<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Kontrol Petugas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6 flex justify-center items-center font-sans">
  <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full border border-slate-200">
    <div class="border-b border-slate-200 pb-4 mb-6 text-center">
      <h1 class="text-2xl font-black text-slate-800">Panel Pemanggil Antrean</h1>
      <p class="text-slate-500 text-sm">Ruang Dokter / Loket Pelayanan</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Loket / Poli Anda</label>
        <select id="counter-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-800 font-medium focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="Loket 1">Loket 1 (Pendaftaran)</option>
          <option value="Loket 2">Loket 2 (Kasir)</option>
          <option value="Poli Umum">Poli Umum</option>
          <option value="Poli Gigi">Poli Gigi</option>
          <option value="Apotek">Apotek / Farmasi</option>
        </select>
      </div>

      <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
        <span class="text-xs uppercase font-semibold text-blue-600 tracking-wider">Antrean Saat Ini</span>
        <div id="active-queue" class="text-4xl font-black text-blue-900 mt-1">A-000</div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="btn-next" class="col-span-2 bg-blue-600 hover:bg-blue-700 active:scale-95 transition text-white font-bold py-3 px-4 rounded-xl shadow-md">
          Panggil Berikutnya
        </button>
        <button id="btn-recall" class="bg-amber-500 hover:bg-amber-600 active:scale-95 transition text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm">
          Panggil Ulang
        </button>
        <button id="btn-reset" class="bg-rose-500 hover:bg-rose-600 active:scale-95 transition text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm">
          Reset Nomor
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
