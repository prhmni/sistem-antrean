<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Monitor Antrean</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans select-none">

  <!-- Header Monitor -->
  <header class="bg-slate-800 border-b border-slate-700 p-6 flex justify-between items-center shadow-lg">
    <div>
      <h1 class="text-3xl font-black tracking-wide text-blue-400">SISTEM ANTREAN TERPADU</h1>
      <p class="text-slate-400 text-sm">Poli & Pelayanan Rawat Jalan</p>
    </div>

    <div class="flex items-center gap-6">
      <!-- Tombol Izin Suara Autoplay -->
      <button id="btn-audio-init" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs uppercase px-4 py-2 rounded-full transition flex items-center gap-2 shadow-lg cursor-pointer">
        <span>🔔 Klik Sekali untuk Aktifkan Suara</span>
      </button>

      <div id="clock" class="text-3xl font-mono font-bold text-amber-400">00:00:00</div>
    </div>
  </header>

  <!-- Konten Utama: Nomor Terkini & Histori -->
  <main class="flex-1 p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 items-center">
    <!-- Panggilan Terkini -->
    <div class="lg:col-span-2 bg-slate-800/80 border-2 border-blue-500/50 rounded-3xl p-10 shadow-2xl flex flex-col items-center justify-center text-center">
      <span class="text-xl uppercase font-semibold text-slate-300 tracking-wider">Nomor Antrean</span>
      <div id="current-number" class="text-8xl md:text-9xl font-black text-amber-400 my-6 tracking-tight drop-shadow-md">
        A-000
      </div>
      <div class="bg-blue-600/30 border border-blue-500/50 rounded-2xl px-8 py-3">
        <span class="text-lg text-slate-300">Menuju Ke: </span>
        <span id="current-counter" class="text-2xl font-bold text-white ml-2">Menunggu Panggilan...</span>
      </div>
    </div>

    <!-- Riwayat Panggilan Terakhir -->
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 h-full flex flex-col">
      <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-3 mb-4">Panggilan Sebelumnya</h2>
      <ul id="history-list" class="space-y-3 flex-1 overflow-y-auto"></ul>
    </div>
  </main>

  <!-- Footer Running Text -->
  <footer class="bg-slate-950 border-t border-slate-800 py-3 px-6 overflow-hidden">
    <marquee class="text-slate-400 text-sm font-medium">
      Selamat datang di pusat layanan terpadu. Silakan menuju loket atau poli saat nomor Anda dipanggil.
    </marquee>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
